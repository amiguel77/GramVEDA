<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile — GramVEDA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav shell">
    <a class="brand" href="index.html">
      <span class="brand-mark">G</span>
      <span>Gram<span>VEDA</span></span>
    </a>
  </header>

  <main class="auth-wrap">
    <form id="profileForm" class="auth-form">
      <h1>My Profile</h1>

      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone">

      <label>Role</label>
      <input type="text" id="role" disabled>

      <label>Email</label>
      <input type="email" id="email" disabled>

      <button type="submit" class="btn btn-coral">Save changes</button>
      <p id="formError" class="form-error"></p>
      <p id="formSuccess" class="form-success"></p>
    </form>

    <a href="history.html" class="btn btn-dark" style="margin-top:16px;width:100%;max-width:400px;text-align:center;text-decoration:none;">
      View my history
    </a>

    <button id="logoutBtn" class="btn" style="margin-top:12px;width:100%;max-width:400px;background:transparent;border:1px solid var(--line);color:var(--ink);">
      Log out
    </button>
  </main>

  <script src="https://js-de.sentry-cdn.com/a9dd01a8f0321dbbdcbc3c8c55d454b8.min.js" crossorigin="anonymous"></script>
  <script src="sentry.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="profile.js"></script>
</body>
</html>
