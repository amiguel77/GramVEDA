<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — Rural Welfare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="brand">Rural Welfare</a>
  </header>

  <main class="auth-wrap">
    <form id="registerForm" class="auth-form">
      <h1>Create an account</h1>

      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <label for="role">I am a</label>
      <select id="role">
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
      </select>

      <button type="submit" class="btn btn-coral">Register</button>
      <p id="formError" class="form-error"></p>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
