<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Rural Welfare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="brand">GramVEDA</a>
  </header>

  <main class="auth-wrap">
    <form id="loginForm" class="auth-form">
      <h1>Welcome back</h1>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" class="btn btn-coral">Login</button>
      <p id="formError" class="form-error"></p>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Register</a></p>
  </main>

  <script src="https://js-de.sentry-cdn.com/a9dd01a8f0321dbbdcbc3c8c55d454b8.min.js" crossorigin="anonymous"></script>
  <script src="sentry.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="login.js"></script>
</body>
</html>
